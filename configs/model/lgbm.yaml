# LightGBM on engineered window features (SPEC §5.1 item 1). Fixed up front, not tuned on test.
name: lgbm
early_stopping_rounds: 200
params:
  n_estimators: 5000
  learning_rate: 0.02
  num_leaves: 31
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
