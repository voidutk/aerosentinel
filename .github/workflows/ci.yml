name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      # The lock pins CPU-only torch from the PyTorch CPU index (SPEC §12).
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Fast tests
        run: uv run pytest -q -m "not slow"
