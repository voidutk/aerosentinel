[project]
name = "aerosentinel"
version = "0.0.0"
description = "Uncertainty-aware remaining-useful-life prediction and maintenance decisions for turbofan engines (NASA C-MAPSS / N-CMAPSS)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "captum>=0.9.0",
    "fastapi>=0.165.0",
    "h5py>=3.16.0",
    "hydra-core>=1.3.8",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.4.6",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "pandas>=3.1.1",
    "plotly>=7.2.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerosentinel"]

# --- PyTorch: CPU-only wheels (SPEC §12) ------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# The lock pins CPU torch for local and CI runs. Kaggle GPU runs (Phase 3) must keep
# Kaggle's preinstalled CUDA torch: install this package with `pip install --no-deps -e .`
# plus the non-torch dependencies, and NEVER run `uv sync --locked` there.
torch = { index = "pytorch-cpu" }

# --- Lint / format ------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

# --- Types --------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["aerosentinel"]

[[tool.mypy.overrides]]
module = [
    "h5py",
    "h5py.*",
    "lightgbm",
    "lightgbm.*",
    "captum",
    "captum.*",
    "mlflow",
    "mlflow.*",
    "onnxruntime",
    "onnxruntime.*",
]
ignore_missing_imports = true

# --- Tests --------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: heavy tests (deselect with -m \"not slow\")"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
